name: 部署到 Github Pages

on:
  workflow_dispatch:
  push:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库
        uses: actions/checkout@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v3

      - name: Node - 更新包
        run: npm update

      - name: Node - 安装依赖
        run: npm install

      - name: Node - 构建
        run: npm run build

      - name: 准备部署目录
        run: |
          mkdir -p public
          cp -r dist public/

      - name: 部署到 Github Pages
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: gh-pages
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
