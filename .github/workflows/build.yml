name: 构建播放器

on:
  workflow_dispatch:
  push:
    paths:
      - "bilibiliplayer/**"

jobs:
  build:
    name: Build Player
    runs-on: ubuntu-latest
    steps:
      - name: 检查仓库
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v3

      - name: Node - 更新包
        run: npm update

      - name: Node - 安装依赖
        run: npm install

      - name: Node - 构建
        run: npm run build

      - name: 上传文件
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Old-Player
          path: dist/**/*
          retention-days: 30
