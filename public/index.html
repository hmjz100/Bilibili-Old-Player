<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>哔哩哔哩旧播放器</title>
	<script src="https://unpkg.com/jquery@3.6.0/dist/jquery.min.js"></script>
	<link rel="stylesheet" href="./video.css" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.player {
			display: block;
			position: relative;
			width: 1160px;
			height: 720px;
			margin: 0 auto;
			padding: 0;
			background-color: #333;
			-webkit-box-shadow: #ddd 0 0 5px;
			box-shadow: 0 0 5px #ddd;
			background-image: url(https://s1.hdslb.com/bfs/static/bangumi/play/asserts/limit-player-1.png);
			background-position: bottom;
			background-repeat: no-repeat;
		}

		#bofqi {
			margin: 0;
			padding: 0;
			padding: 0;
			width: 100%;
			height: 100%;
		}

		.player .bilibili-player {
			box-shadow: none;
		}

		.player .bilibili-player-video-bottom-area .bilibili-player-video-sendbar {
			box-sizing: border-box;
			border-left: 1.5px solid #f4f4f4;
			border-bottom: 1.5px solid #f4f4f4;
			border-right: 1.5px solid #f4f4f4;
		}

		.player-with-auxiliary {
			display: -webkit-box;
			display: -webkit-flex;
			display: -ms-flexbox;
			display: -moz-box;
			display: -moz-flex;
			display: flex;
		}

		.player-with-auxiliary .player {
			-webkit-box-flex: 1;
			-webkit-flex: 1;
			-moz-box-flex: 1;
			-moz-flex: 1;
			-ms-flex: 1;
			flex: 1;
		}

		.player-with-auxiliary .danmaku-box {
			width: 320px;
			margin-left: 30px;
		}

		.player-mode-widescreen .danmaku-box {
			display: none;
		}

		#act-preview-alert-mask {
			display: none !important;
		}

		#url-input-container {
			position: absolute;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 10000;
			display: flex;
			gap: 10px;
			background: rgba(0, 0, 0, 0.8);
			padding: 10px;
			border-radius: 8px;
			align-items: center;
		}

		#url-input {
			width: 400px;
			padding: 8px 12px;
			border: none;
			border-radius: 4px;
			font-size: 14px;
		}

		#load-btn {
			padding: 8px 20px;
			background: #00a1d6;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
		}

		#load-btn:hover {
			background: #00b5e5;
		}
	</style>
</head>

<body>
	<div id="heimu"></div>
	<div class="player">
		<div id="bofqi"></div>
	</div>

	<script type="text/javascript">
		var url = './video.js?t=' + Date.now();
		var playerInstance = null;
		function loadJS(url, callback) {
			var script = document.createElement('script'),
				fn = callback || function () { };
			script.type = 'text/javascript';

			if (script.readyState) {
				script.onreadystatechange = function () {
					if (script.readyState == 'loaded' || script.readyState == 'complete') {
						script.onreadystatechange = null;
						fn();
					}
				};
			} else {
				script.onload = function () {
					fn();
				};
			}
			script.src = url;
			document.getElementsByTagName('head')[0].appendChild(script);
		}

		function createUrlInput() {
			var container = document.createElement('div');
			container.id = 'url-input-container';

			var input = document.createElement('input');
			input.id = 'url-input';
			input.type = 'text';
			input.placeholder = '请输入视频 URL (支持本地文件路径或在线链接)';

			var btn = document.createElement('button');
			btn.id = 'load-btn';
			btn.textContent = '加载视频';
			btn.onclick = loadCustomVideo;

			container.appendChild(input);
			container.appendChild(btn);
			document.body.appendChild(container);
		}

		function loadCustomVideo() {
			var videoUrl = document.getElementById('url-input').value;
			if (!videoUrl) {
				alert('请输入视频 URL');
				return;
			}
			if (playerInstance) {
				try {
					playerInstance.loadCustomUrl(videoUrl);
				} catch (e) {
					console.error('加载自定义视频失败:', e);
					alert('加载视频失败: ' + e.message);
				}
			} else {
				console.warn('播放器尚未初始化，无法加载自定义视频');
			}
		}

		loadJS(url, function () {
			createUrlInput();
			// 只有当查询参数存在时才初始化播放器，否则先不播放
			var search = location.search.slice(1) || '';
			window.EmbedPlayer && window.EmbedPlayer('player', '', search, '', false, '', true);

			// 临时容器方案
			try {
				if (window.frameElement && top.location.href) {
					if (!window.parent.Html5IframeInitializedInjected) {
						window.parent.Html5IframeInitializedInjected = window.parent.Html5IframeInitialized || function () { };

						window.parent.Html5IframeInitialized = function () {
							var hasPlay = false;
							// 如果有其它视频在播放时，当前视频暂停
							top.document.querySelectorAll('iframe').forEach(function (e) {
								try {
									if (e.contentWindow.player) {
										playerInstance = e.contentWindow.player;
										if (hasPlay) {
											e.contentWindow.player.pause();
										} else if (!e.contentWindow.document.querySelector('video').paused) {
											hasPlay = true;
										}

										if (!e.contentWindow.initializedInjected) {
											e.contentWindow.initializedInjected = true;

											// 当前视频播放时，其它视频暂停
											e.contentWindow.player.addEventListener('video_media_play', function () {
												top.document.querySelectorAll('iframe').forEach(function (g) {
													try {
														if (g !== e.contentWindow.frameElement && g.contentWindow.player) {
															if (!g.contentWindow.document.querySelector('video').paused) {
																g.contentWindow.player.pause();
															}
														}
													} catch (e) { }
												});
											});
										}
									}
								} catch (e) { }
							});
							return window.parent.Html5IframeInitializedInjected();
						};
					}
				}
			} catch (e) { }
			// 直接引用 player 变量
			setTimeout(function () {
				if (window.player) {
					playerInstance = window.player;
				}
			}, 1000);
		});
	</script>
</body>

</html>
