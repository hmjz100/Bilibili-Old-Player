<body>
	<div class="wrap">
		<div id="demo-error" class="demo-error" hidden>
			<span id="demo-error-text"></span>
			<button id="demo-error-close" type="button" title="关闭" onclick="window.demoPlayerCloseError && window.demoPlayerCloseError()">✕</button>
		</div>
		<h1>Bilibili-Old 演示 - 重构播放器</h1>
		<div class="tip">输入视频链接，或直接选择本地文件，即可享用本仓库的重构哔哩哔哩经典播放器播放视频。</div>
		<div class="tip">
			</p>地址也可通过 <code>?url=</code> 直接指定；视频链接需要目标服务器允许跨域（CORS），否则取不到流。</div>

		<div class="row">
			<span class="label">视频</span>
			<input id="demo-vd-url" type="text" placeholder="视频地址" spellcheck="false">
			<button id="demo-vd-load" class="primary" type="button">播放</button>
			<button id="demo-pick" type="button">本地</button>
			<button id="demo-clear-video" type="button" title="移除视频">✕</button>
			<input id="demo-vd-file" type="file" hidden accept="video/*,audio/*,.mp4,.m4v,.mov,.flv,.ts,.mkv,.webm,.mp3,.m4a,.aac,.flac,.wav,.opus">
		</div>

		<div class="row">
			<span class="label">弹幕</span>
			<input id="demo-dm-url" type="text" placeholder="弹幕地址" spellcheck="false">
			<button id="demo-dm-load" class="primary" type="button">加载</button>
			<button id="demo-dm" type="button">本地</button>
			<button id="demo-clear-dm" type="button" title="移除弹幕">✕</button>
			<input id="demo-dm-file" type="file" hidden accept=".xml,.json,application/xml,application/json">
		</div>

		<div class="row samples">
			<span class="label">示例</span>
			<button type="button" data-url="https://www.w3schools.com/html/mov_bbb.mp4">https://www.w3schools.com/html/mov_bbb.mp4</button>
		</div>
	</div>

	<div class="player-box">
		<div class="bili-wrapper" id="demo-vd-loader">
			<div id="heimu"></div>
			<div class="bili-wrapper" id="bofqi">
				<div id="player_placeholder" class="player"></div>
			</div>
		</div>
		<!--div class="video-toolbar-module bili-wrapper report-wrap-module report-scroll-module" id="arc_toolbar_report">
			
		</div-->
	</div>

	<script src="./scripts/jquery.min.js"></script>
	<script src="./scripts/video.js"></script>
	<script src="./scripts/index.js"></script>
	<script>
		(function () {
			var playerBox = document.getElementById('demo-vd-loader');

			var video_url_input = document.getElementById('demo-vd-url');
			var video_file_input = document.getElementById('demo-vd-file');
			var video_load_btn = document.getElementById('demo-vd-load');

			var danmaku_url_input = document.getElementById('demo-dm-url');
			var danmaku_file_input = document.getElementById('demo-dm-file');
			var danmaku_load_btn = document.getElementById('demo-dm-load');

			video_load_btn.addEventListener('click', function () {
				var url = (video_url_input.value || '').trim();
				if (url) {
					window.demoPlayerStart(url);
				} else {
					video_file_input.click();
				}
			});
			video_url_input.addEventListener('keydown', function (e) {
				if (e.key === 'Enter') {
					video_load_btn.click();
				}
			});
			video_file_input.addEventListener('change', function () {
				if (video_file_input.files && video_file_input.files[0]) {
					window.demoPlayerLocalFile(video_file_input.files[0]);
				}
			});
			danmaku_file_input.addEventListener('change', function () {
				if (danmaku_file_input.files && danmaku_file_input.files[0]) {
					window.demoPlayerDanmakuFile(danmaku_file_input.files[0]);
				}
			});
			// 弹幕地址（xml / json）
			danmaku_load_btn.addEventListener('click', function () {
				var u = (danmaku_url_input.value || '').trim();
				if (u) {
					window.demoPlayerDanmakuUrl(u);
				} else {
					danmaku_file_input.click();
				}
			});
			danmaku_url_input.addEventListener('keydown', function (e) {
				if (e.key === 'Enter') {
					danmaku_load_btn.click();
				}
			});
			// 两行的清除按钮
			document.getElementById('demo-clear-video').addEventListener('click', function () {
				window.demoPlayerClearVideo();
			});
			document.getElementById('demo-clear-dm').addEventListener('click', function () {
				window.demoPlayerClearDanmaku();
			});
			Array.prototype.forEach.call(document.querySelectorAll('.samples button'), function (btn) {
				btn.addEventListener('click', function () {
					window.demoPlayerStart(btn.getAttribute('data-url'));
				});
			});

			// 拖拽本地文件到播放器区域即可播放
			['dragenter', 'dragover'].forEach(function (name) {
				playerBox.addEventListener(name, function (e) {
					e.preventDefault();
					playerBox.classList.add('dragover');
				});
			});
			['dragleave', 'dragend'].forEach(function (name) {
				playerBox.addEventListener(name, function () {
					playerBox.classList.remove('dragover');
				});
			});
			playerBox.addEventListener('drop', function (e) {
				e.preventDefault();
				playerBox.classList.remove('dragover');
				var files = e.dataTransfer && e.dataTransfer.files;
				if (files && files[0]) {
					window.demoPlayerLocalFile(files[0]);
				}
			});
		})();
	</script>
</body>
