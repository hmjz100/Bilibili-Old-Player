<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>重构播放器 - 哔哩哔哩 (゜-゜)つロ 干杯~-Bilibili-Old-Player</title>
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="./video.css">
	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			min-height: 100%;
			background: #17181c;
			color: #e6e8eb;
			font: 14px/1.6 "Microsoft YaHei", -apple-system, "Segoe UI", Roboto, sans-serif;
		}

		.wrap {
			max-width: 1240px;
			margin: 0 auto;
			padding: 20px 16px 48px;
		}

		/* 两行输入（视频 / 弹幕）：输入框 + 按钮 + 右侧清除按钮 */
		.row {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
			margin-bottom: 8px;
		}

		.row .label {
			flex: 0 0 44px;
			color: #9aa4b2;
			font-size: 13px;
		}

		.row input[type="text"] {
			flex: 1 1 420px;
			min-width: 220px;
			padding: 8px 10px;
			border: 1px solid #2f3238;
			border-radius: 6px;
			background: #1f2126;
			color: inherit;
			font: inherit;
		}

		.row select,
		.row button {
			padding: 8px 14px;
			border: 1px solid #2f3238;
			border-radius: 6px;
			background: #26282e;
			color: inherit;
			font: inherit;
			cursor: pointer;
			white-space: nowrap;
		}

		.row button.primary {
			border-color: #00a1d6;
			background: #00a1d6;
			color: #fff;
		}

		.row button:hover {
			border-color: #00a1d6;
		}

		/* 清除按钮：一个小 × */
		.row button.clear {
			flex: 0 0 auto;
			width: 34px;
			padding: 8px 0;
			color: #9aa4b2;
			line-height: 1;
			text-align: center;
		}

		.row button.clear:hover {
			color: #ef9a9a;
			border-color: #d63a3a;
		}

		/* 旧版 .bar 选择器保留兼容 */
		.bar {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
			margin-bottom: 10px;
		}

		h1 {
			margin: 0 0 4px;
			font-size: 20px;
		}

		.tip {
			margin: 0 0 16px;
			color: #9aa4b2;
			font-size: 13px;
		}

		.tip code {
			color: #7fd6ef;
		}

		.bar {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
			margin-bottom: 10px;
		}

		.bar input[type="text"] {
			flex: 1 1 380px;
			min-width: 240px;
			padding: 8px 10px;
			border: 1px solid #2f3238;
			border-radius: 6px;
			background: #1f2126;
			color: inherit;
			font: inherit;
		}

		.bar select,
		.bar button {
			padding: 8px 14px;
			border: 1px solid #2f3238;
			border-radius: 6px;
			background: #26282e;
			color: inherit;
			font: inherit;
			cursor: pointer;
		}

		.bar button.primary {
			border-color: #00a1d6;
			background: #00a1d6;
			color: #fff;
		}

		.bar button:hover {
			border-color: #00a1d6;
		}

		.samples {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			margin: 0 0 12px;
			font-size: 13px;
			color: #9aa4b2;
			align-items: center;
		}

		.samples button {
			padding: 4px 10px;
			border: 1px solid #2f3238;
			border-radius: 999px;
			background: #1f2126;
			color: #c7ccd3;
			font: inherit;
			cursor: pointer;
		}

		/* 只在出错时出现的顶部提示条：纯边框、恒定蓝色、可关闭 */
		.demo-error {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin: 0 0 12px;
			padding: 8px 8px 8px 12px;
			border: 1px solid #00a1d6;
			border-radius: 6px;
			background: #1f2126;
			color: #7fd6ef;
			word-break: break-all;
		}

		.demo-error[hidden] {
			display: none;
		}

		.demo-error button {
			flex: 0 0 auto;
			padding: 2px 10px;
			border: 1px solid #2f3238;
			border-radius: 6px;
			background: #26282e;
			color: #9aa4b2;
			font: inherit;
			line-height: 1.4;
			cursor: pointer;
		}

		.demo-error button:hover {
			border-color: #00a1d6;
			color: #7fd6ef;
		}

		/* 播放器容器：与主站一致的比例（1160×720），居中并按可用宽度等比放大 */
		.player {
			position: relative;
			width: 100%;
			max-width: 1160px;
			margin: 0 auto;
			aspect-ratio: 1160 / 720;
			background: #000;
			border-radius: 6px;
			overflow: hidden;
			outline: 2px dashed transparent;
			outline-offset: -2px;
			transition: outline-color 0.15s;
		}

		.player.dragover {
			outline-color: #00a1d6;
		}

		.player.dragover::after {
			content: "松手即用本地文件播放";
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.55);
			color: #7fd6ef;
			font-size: 16px;
			pointer-events: none;
			z-index: 10;
		}

		#bofqi {
			width: 100%;
			height: 100%;
		}

		/* 演示页固定用 HTML5 播放器，隐藏播放器自带的「Flash/HTML5 播放器」切换按钮 */
		.bgray-btn-wrap {
			display: none !important;
		}

		footer {
			margin-top: 16px;
			color: #6b7280;
			font-size: 12px;
			line-height: 1.8;
		}

		footer code {
			color: #9aa4b2;
		}
	</style>
</head>

<body>
	<div class="wrap">
		<div id="demo-error" class="demo-error" hidden>
			<span id="demo-error-text"></span>
			<button id="demo-error-close" type="button" title="关闭" onclick="window.demoPlayerCloseError && window.demoPlayerCloseError()">✕</button>
		</div>
		<h1>Bilibili-Old-Player 重构播放器演示</h1>
		<p class="tip">输入 <code>mp4</code>、<code>mp3</code>、<code>flv</code> 等格式文件的链接，或直接选择本地文件，用本仓库重构的 B 站经典播放器播放。</p>

		<div class="row">
			<span class="label">视频</span>
			<input id="demo-url" type="text" placeholder="视频地址" spellcheck="false">
			<button id="demo-play" class="primary" type="button">播放</button>
			<button id="demo-pick" type="button">本地文件</button>
			<button id="demo-clear-video" type="button" title="移除视频">✕</button>
			<input id="demo-file" type="file" hidden accept="video/*,audio/*,.mp4,.m4v,.mov,.flv,.ts,.mkv,.webm,.mp3,.m4a,.aac,.flac,.wav,.opus">
		</div>

		<div class="row">
			<span class="label">弹幕</span>
			<input id="demo-dm-url" type="text" placeholder="弹幕地址" spellcheck="false">
			<button id="demo-dm-load" class="primary" type="button">加载弹幕</button>
			<button id="demo-dm" type="button">弹幕文件</button>
			<button id="demo-clear-dm" type="button" title="移除弹幕">✕</button>
			<input id="demo-dm-file" type="file" hidden accept=".xml,.json,application/xml,application/json">
		</div>

		<div class="samples">
			<span>示例：</span>
			<button type="button" data-url="https://www.w3schools.com/html/mov_bbb.mp4">mp4</button>
			<span>（弹幕支持 B 站 xml 与 json；视频与弹幕文件都可以拖进播放器区域）</span>
		</div>

		<footer>
			播放器产物不包含 jQuery，本页已内置 jQuery（<code>public/vendor/</code>，由 <code>node public/build-demo.mjs</code> 生成）。<br>
			地址也可通过 <code>?url=</code> 直接指定；<code>flv</code> 需要目标服务器允许跨域（CORS），否则取不到流。
		</footer>


		<div class="player" id="demo-player">
			<div id="heimu"></div>
			<div id="bofqi"></div>
		</div>
	</div>

	<script src="./vendor/jquery.min.js"></script>
	<script src="./video.js"></script>
	<script src="./demo.js"></script>
	<script>
		(function () {
			var input = document.getElementById('demo-url');
			var play = document.getElementById('demo-play');
			var pick = document.getElementById('demo-pick');
			var file = document.getElementById('demo-file');
			var dmPick = document.getElementById('demo-dm');
			var dmFile = document.getElementById('demo-dm-file');
			var playerBox = document.getElementById('demo-player');

			play.addEventListener('click', function () {
				var url = (input.value || '').trim();
				if (url) {
					window.demoPlayerStart(url);
				}
			});
			input.addEventListener('keydown', function (e) {
				if (e.key === 'Enter') {
					play.click();
				}
			});
			pick.addEventListener('click', function () {
				file.click();
			});
			file.addEventListener('change', function () {
				if (file.files && file.files[0]) {
					window.demoPlayerLocalFile(file.files[0]);
				}
			});
			dmPick.addEventListener('click', function () {
				dmFile.click();
			});
			dmFile.addEventListener('change', function () {
				if (dmFile.files && dmFile.files[0]) {
					window.demoPlayerDanmakuFile(dmFile.files[0]);
				}
			});
			// 弹幕地址（xml / json）
			document.getElementById('demo-dm-load').addEventListener('click', function () {
				var u = (document.getElementById('demo-dm-url').value || '').trim();
				if (u) {
					window.demoPlayerDanmakuUrl(u);
				}
			});
			document.getElementById('demo-dm-url').addEventListener('keydown', function (e) {
				if (e.key === 'Enter') {
					document.getElementById('demo-dm-load').click();
				}
			});
			// 两行的清除按钮
			document.getElementById('demo-clear-video').addEventListener('click', function () {
				window.demoPlayerClearVideo();
			});
			document.getElementById('demo-clear-dm').addEventListener('click', function () {
				window.demoPlayerClearDanmaku();
			});
			Array.prototype.forEach.call(document.querySelectorAll('.samples button'), function (btn) {
				btn.addEventListener('click', function () {
					window.demoPlayerStart(btn.getAttribute('data-url'));
				});
			});

			// 拖拽本地文件到播放器区域即可播放
			['dragenter', 'dragover'].forEach(function (name) {
				playerBox.addEventListener(name, function (e) {
					e.preventDefault();
					playerBox.classList.add('dragover');
				});
			});
			['dragleave', 'dragend'].forEach(function (name) {
				playerBox.addEventListener(name, function () {
					playerBox.classList.remove('dragover');
				});
			});
			playerBox.addEventListener('drop', function (e) {
				e.preventDefault();
				playerBox.classList.remove('dragover');
				var files = e.dataTransfer && e.dataTransfer.files;
				if (files && files[0]) {
					window.demoPlayerLocalFile(files[0]);
				}
			});
		})();
	</script>
</body>

</html>
