<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>哔哩哔哩旧播放器</title>
    <link rel="stylesheet" href="/dist/video.css" />
    <style>
        html,body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #bofqi {
            width: 800px;
            max-width: 95%;
            height: 450px;
            max-height: 80vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="bofqi">
        <!-- 播放器容器 -->
    </div>

    <script src="/dist/video.js"></script>
    <script>
        window.EmbedPlayer && new EmbedPlayer('#bofqi', { /* options */ });
        // 若需要，可在此初始化 /dist/video.js 提供的播放器
        // 例如: window.VideoPlayer && new VideoPlayer('#bofqi', { /* options */ });
    </script>
</body>
</html>
